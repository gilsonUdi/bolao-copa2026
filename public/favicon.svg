<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo da bola (branco) -->
  <circle cx="50" cy="50" r="48" fill="white" stroke="#222" stroke-width="2"/>

  <!-- Pentágono central preto -->
  <polygon points="50,22 63,31 58,47 42,47 37,31" fill="#111"/>

  <!-- Pentágonos ao redor (6 faces pretas visíveis) -->
  <polygon points="50,22 37,31 28,20 35,8 52,8" fill="#111"/>
  <polygon points="50,22 63,31 74,22 68,8 52,8" fill="#111"/>
  <polygon points="37,31 28,20 14,28 16,45 33,48" fill="#111"/>
  <polygon points="63,31 74,22 86,28 85,45 68,48" fill="#111"/>
  <polygon points="42,47 33,48 28,63 42,70 50,60" fill="#111"/>
  <polygon points="58,47 68,48 72,63 58,70 50,60" fill="#111"/>

  <!-- Borda da bola -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#222" stroke-width="3"/>
</svg>
